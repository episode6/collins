# Modified from the original agent-session-manager
# (https://github.com/r4nd3l/agent-session-manager, GPL-3.0) in the ghackett
# fork. Last modified: 2026-09-02. Full change history: git log for this file.

[project]
# The distribution name, the installed command and the import package are all
# "collins" -- the name was unregistered on PyPI when we claimed it.
name = "collins"
version = "0.1.3"
description = "Collins — native GTK4 GUI to manage and resume Claude Code sessions"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Máté Molnár", email = "molnar.mate@zengo.eu" }]
# No comma in the maintainer name: it renders into the RFC 822 style
# Maintainer-email metadata field, where one would split the mailbox.
maintainers = [{ name = "episode6", email = "support@episode6.com" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: GTK",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Terminals",
]
# PyGObject/GTK/VTE come from system packages (see README), not pip:
#   sudo apt install python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-vte-3.91
dependencies = []

[project.urls]
Homepage = "https://github.com/episode6/collins"
Issues = "https://github.com/episode6/collins/issues"

[project.scripts]
collins = "collins.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["collins*"]

[tool.setuptools.package-data]
# Everything the app needs at runtime ships *inside* the package, because a
# wheel is the only thing `pip install collins` unpacks: no post-install hook
# runs, and data_files only lands correctly for `pip install --user` (pipx and
# venvs miss it entirely). So the notices the About dialog reads, the action
# icons app.py puts on the icon search path, and the launcher/metainfo
# `collins --install-desktop` writes out are all package data. The paths below
# are symlinks into data/ (and the repo root symlinks back to the notices), so
# each file still has exactly one copy in the tree.
#
# The Debug-variant icons are listed out deliberately: like the .deb, the wheel
# leaves them behind — they are a source-checkout thing (start-debug).
# scripts/verify_wheel_data.py is the CI guard that all of this really landed.
collins = [
    "locale/*/LC_MESSAGES/*.mo",
    "THIRD_PARTY_LICENSES.md",
    "icons/com.episode6.Collins.svg",
    "icons/com.episode6.Collins-panel.svg",
    "icons/com.episode6.Collins-panel-working.svg",
    "icons/com.episode6.Collins-panel-empty.svg",
    "icons/hicolor/scalable/actions/*.svg",
    "sounds/*.oga",
    "com.episode6.Collins.desktop",
    "com.episode6.Collins.metainfo.xml",
    # The hunk extension behind the git page (gitpage.py, hunkctl.EXTENSION_DIR):
    # hunk loads it straight out of the package directory (`--extension
    # <dir>`) and transpiles the TypeScript itself, so the sources ship as
    # data, with no build step. Its tests (test/), tsconfig.json and
    # whatever a local `bun install` leaves behind stay out.
    "hunkext/collins-git/package.json",
    "hunkext/collins-git/README.md",
    "hunkext/collins-git/*.ts",
    "hunkext/collins-git/*.tsx",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E402"]  # gi.require_version must precede gi.repository imports

[tool.pytest.ini_options]
testpaths = ["tests"]
