# Modified from the original agent-session-manager
# (https://github.com/r4nd3l/agent-session-manager, GPL-3.0) in the ghackett
# fork. Last modified: 2026-07-26. Full change history: git log for this file.

[project]
# PyPI distribution name (suffixed to stay unambiguous on PyPI). The
# installed command and the import package are both "collins".
name = "collins-gtk"
version = "2.0.0"
description = "Collins — native GTK4 GUI to manage and resume Claude Code sessions"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Máté Molnár", email = "molnar.mate@zengo.eu" }]
maintainers = [{ name = "Geoff Hackett", email = "ghackett@gmail.com" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: GTK",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Terminals",
]
# PyGObject/GTK/VTE come from system packages (see README), not pip:
#   sudo apt install python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-vte-3.91
dependencies = []

[project.urls]
Homepage = "https://github.com/ghackett/agent-session-manager"
Issues = "https://github.com/ghackett/agent-session-manager/issues"

[project.scripts]
collins = "collins.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["collins*"]

[tool.setuptools.package-data]
collins = ["locale/*/LC_MESSAGES/*.mo"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E402"]  # gi.require_version must precede gi.repository imports

[tool.pytest.ini_options]
testpaths = ["tests"]
