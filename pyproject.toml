# Modified from the original agent-session-manager
# (https://github.com/r4nd3l/agent-session-manager, GPL-3.0) in the ghackett
# fork. Last modified: 2026-08-19. Full change history: git log for this file.

[project]
# The distribution name, the installed command and the import package are all
# "collins" -- the name was unregistered on PyPI when we claimed it.
name = "collins"
version = "0.1.1"
description = "Collins — native GTK4 GUI to manage and resume Claude Code sessions"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Máté Molnár", email = "molnar.mate@zengo.eu" }]
# No comma in the maintainer name: it renders into the RFC 822 style
# Maintainer-email metadata field, where one would split the mailbox.
maintainers = [{ name = "episode6", email = "support@episode6.com" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: GTK",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Terminals",
]
# PyGObject/GTK/VTE come from system packages (see README), not pip:
#   sudo apt install python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-vte-3.91
dependencies = []

[project.urls]
Homepage = "https://github.com/episode6/collins"
Issues = "https://github.com/episode6/collins/issues"

[project.scripts]
collins = "collins.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["collins*"]

[tool.setuptools.package-data]
# The notices ship inside the package (the wheel is all the .deb installs), so
# the About dialog can always read them; the repo root symlinks to the file.
collins = ["locale/*/LC_MESSAGES/*.mo", "THIRD_PARTY_LICENSES.md"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E402"]  # gi.require_version must precede gi.repository imports

[tool.pytest.ini_options]
testpaths = ["tests"]
