        <rect x="7.3" y="1.75" width="1.4" height="12.5" rx="0.7"/>
        <rect x="7.3" y="1.75" width="1.4" height="12.5" rx="0.7" transform="rotate(90 8 8)"/>
        <rect x="7.3" y="1.75" width="1.4" height="12.5" rx="0.7" transform="rotate(45 8 8)"/>
        <rect x="7.3" y="1.75" width="1.4" height="12.5" rx="0.7" transform="rotate(-45 8 8)"/>
    </g>
</svg>
