<?xml version="1.0" encoding="UTF-8"?>
<!-- The sandboxed session's shield: the footer chip on a sandboxed tab and
     the tab icon of a sandboxed panel shell (collins/sandboxchip.py).
     Drawn for this fork (GPL-3.0).

     A single filled path, as GTK's symbolic recoloring requires (its
     minimal SVG parser drops strokes and ignores transforms): the shield's
     outline is the outer contour minus an inner contour wound the other
     way, so the inside stays transparent whatever the shield is recolored
     to, with a filled keyhole in the middle for the "locked in" reading.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16"><path d="M8 0.5 1.75 2.75V7c0 3.9 2.6 6.9 6.25 8.5C11.65 13.9 14.25 10.9 14.25 7V2.75Zm0 1.6 4.75 1.7V7c0 3.05-1.95 5.45-4.75 6.85C5.2 12.45 3.25 10.05 3.25 7V4.15L8 2.1Zm0 2.4a1.75 1.75 0 0 0-.75 3.33V10.5a.75.75 0 0 0 1.5 0V7.83A1.75 1.75 0 0 0 8 4.5Z"/></svg>
