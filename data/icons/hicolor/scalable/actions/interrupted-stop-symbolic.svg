<?xml version="1.0" encoding="UTF-8"?>
<svg height="16px" viewBox="0 0 16 16" width="16px" xmlns="http://www.w3.org/2000/svg">
    <!-- Filled paths only: GTK recolors symbolic icons by overriding fill on
         every shape, so stroked outlines collapse into silhouettes. The ring
         is copied from waiting-question-symbolic so the two state badges read
         as a pair; the stop square sits inside it like a media-stop glyph. -->
    <g fill="#2e3436">
        <path fill-rule="evenodd" d="M 1 8 A 7 7 0 1 1 15 8 A 7 7 0 1 1 1 8 Z M 2.25 8 A 5.75 5.75 0 1 0 13.75 8 A 5.75 5.75 0 1 0 2.25 8 Z"/>
        <rect x="5.25" y="5.25" width="5.5" height="5.5" rx="1"/>
    </g>
</svg>
