<?xml version="1.0" encoding="UTF-8"?>
<svg height="16px" viewBox="0 0 16 16" width="16px" xmlns="http://www.w3.org/2000/svg">
    <!-- Dock the floating attachments panel: a window frame with its right
         pane filled solid — the icon is a picture of where the panel lands.
         Counterpart of undock-right-symbolic, which raises the same pane as
         a detached card. Filled paths only: GTK recolors symbolic icons by
         overriding fill on every shape, and (since GTK 4.14 parses these
         itself) group transforms are dropped, so geometry is baked in. -->
