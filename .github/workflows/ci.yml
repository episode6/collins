# Modified from the original agent-session-manager
# (https://github.com/r4nd3l/agent-session-manager, GPL-3.0) in the ghackett
# fork. Last modified: 2026-07-28. Full change history: git log for this file.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --quiet ruff
      - run: ruff check collins/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # System python + apt PyGObject (prebuilt), matching how the app runs:
      # some tested modules (e.g. bgstatus) import gi at module level. GLib/
      # Gio work headless — no display or GTK needed for the test suite.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-gi python3-pytest
      - run: python3 -m pytest tests/ -q
