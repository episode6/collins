# Modified from the original agent-session-manager
# (https://github.com/r4nd3l/agent-session-manager, GPL-3.0) in the ghackett
# fork. Last modified: 2026-08-19. Full change history: git log for this file.

name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --quiet ruff
      - run: ruff check collins/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # System python + apt PyGObject (prebuilt), matching how the app runs:
      # some tested modules (e.g. bgstatus) import gi at module level. GLib/
      # Gio work headless — no display or GTK needed for the test suite.
      # tests/conftest.py blocks the GTK-stack namespaces this leaves out, so a
      # test that would only fail here fails on a dev machine too. Installing
      # the gir packages (and a display) is a deliberate change: widen that
      # blocklist to match if you make it.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-gi python3-pytest
      - run: python3 -m pytest tests/ -q

  # The wheel is the whole of `pip install collins` -- no post-install script
  # runs -- so the icons, launcher template and metainfo have to be inside it.
  # They get there through package-data globs over symlinks into data/, which
  # setuptools has not always followed; a silent miss ships an app with no
  # icons. Build both artifacts the way release.yml does, then check them.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --quiet build
      - run: python -m build
      - run: python3 scripts/verify_wheel_data.py

  # Every committed copy of the version must agree (see RELEASE_CHECKLIST.md);
  # scripts/ship-release.py re-checks the same invariants at ship time.
  verify-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/verify_versions.py
