# Modified from the original agent-session-manager
# (https://github.com/r4nd3l/agent-session-manager, GPL-3.0) in the ghackett
# fork. Last modified: 2026-08-28. Full change history: git log for this file.

name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:

# Jobs that use image dependencies run inside a prebuilt CI image
# (.github/docker/ci.Dockerfile is the one canonical list of build
# dependencies); the image job resolves or builds the three tags. The tiny jobs
# (lint, verify-versions) stay on the bare runner: they need nothing from the
# image, and pulling one to run a one-second script would only slow them down.
# The package is public, so pulling needs no credentials; only the image job
# (which may push) logs in.
jobs:
  image:
    uses: ./.github/workflows/ci-image.yml
    permissions:
      contents: read
      packages: write

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Pinned: an unpinned `pip install ruff` changes the rule set under this
      # job on any given day. Bumping the pin is the deliberate knob.
      - run: pip install --quiet ruff==0.16.4
      - run: ruff check collins/ tests/

  test:
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      # System python + apt PyGObject, matching how the app runs: some tested
      # modules (e.g. bgstatus) import gi at module level. The image carries
      # the whole GTK stack for the e2e job, but the unit suite must not reach
      # it: tests/conftest.py blocks those namespaces so a test that needs a
      # widget (and a display) fails on a dev machine the same way it would
      # here. Widening that blocklist is a deliberate change.
      - run: python3 -m pytest tests/ -q

  # Unlike the unit-test job (which deliberately stays GTK-free to match
  # tests/conftest.py's blocklist), the e2e checks drive real widgets: they
  # need the full gir stack, a display (Xvfb) and a session bus
  # (dbus-run-session, one per check), all of which the full CI image
  # (.github/docker/ci.Dockerfile, --target full) carries. This was once
  # its own workflow (e2e.yml, from when the suite was informational); it
  # lives here now so a Dockerfile-editing PR builds the image once instead
  # of racing two identical builds from two workflows.
  e2e:
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # Worst case, every check hangs on both attempts: checks x 2 x 120s
      # (40 min at 10 checks) plus the image pull. timeout-minutes must
      # stay comfortably above that — and grow as checks are added — so a
      # pathological run still writes its step-summary table instead of
      # being hard-killed by GitHub mid-suite. The whole suite passes in
      # under two minutes; a check that needs more than 120s is hung.
      - run: xvfb-run -a -s "-screen 0 1920x1200x24" python3 scripts/run_e2e.py --timeout 120

  # The wheel is the whole of `pip install collins` -- no post-install script
  # runs -- so the icons, launcher template and metainfo have to be inside it.
  # They get there through package-data globs over symlinks into data/, which
  # setuptools has not always followed; a silent miss ships an app with no
  # icons. Build both artifacts the way release.yml does, then check them.
  packaging:
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      # --no-isolation: build with the image's setuptools instead of fetching
      # one from PyPI per run. It is the same setuptools the resolute PPA
      # build uses, and the one verify_wheel_data.py vouches for.
      - run: python3 -m build --no-isolation
      # What PyPI would reject at upload time (metadata, long_description).
      - run: twine check --strict dist/*
      - run: python3 scripts/verify_wheel_data.py
      - run: ./scripts/build_deb.sh

  # Everything release.yml's ppa job does short of signing and uploading, in
  # the same images -- so a build-dep an image lacks fails a PR here, not the
  # release. v0.1.1's upload died in dpkg-checkbuilddeps (no build-essential)
  # with the tag already published. The noble leg runs in the noble
  # packaging-only image (a source build needs no GTK); the resolute leg uses
  # the full image rather than growing a third tag.
  ppa-source:
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.series == 'noble' && needs.image.outputs.image_noble_pkg || needs.image.outputs.image }}
    strategy:
      fail-fast: false
      matrix:
        series: [noble, resolute]
    steps:
      - uses: actions/checkout@v7
      - name: Build the source package, unsigned
        run: packaging/build-ppa-source.sh --series '${{ matrix.series }}' -- -us -uc
      - name: The upload set is complete
        run: |
          cd "/tmp/collins-ppa/${{ matrix.series }}"
          ls -l
          test -f collins_*~${{ matrix.series }}1_source.changes
          test -f collins_*~${{ matrix.series }}1.dsc
          test -f collins_*~${{ matrix.series }}1.tar.xz

  # Everything release.yml's copr job does short of uploading, plus what
  # COPR's builders would do next: the SRPM from packaging/fedora/collins.spec
  # (rpmlint on both), rebuilt into the binary RPM with its %check run, then
  # installed with dnf so the Requires are proven to resolve on a current
  # Fedora -- a renamed dependency fails a PR here, not the first dnf install
  # after a release. Runs in the Fedora stage of the CI image.
  rpm:
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image_fedora_pkg }}
    steps:
      - uses: actions/checkout@v7
      - name: Build the SRPM, then the binary package from it
        run: packaging/fedora/build-copr-srpm.sh --rebuild
      - name: The package installs, and ships what the app looks for
        run: |
          dnf install -y /tmp/collins-copr/collins-*.noarch.rpm
          rpm -q --requires collins
          test -f /usr/share/applications/com.episode6.Collins.desktop
          test -f /usr/share/metainfo/com.episode6.Collins.metainfo.xml
          test -f /usr/share/icons/hicolor/scalable/apps/com.episode6.Collins.svg
          test -x /usr/bin/collins
          # The action icons ride inside the wheel (app.py's _PACKAGE_ICONS);
          # from / so the import resolves to the installed copy, not the checkout.
          cd /
          icons="$(python3 -c 'import collins, os; print(os.path.dirname(collins.__file__))')/icons"
          test -f "$icons/hicolor/scalable/actions/tab-close-symbolic.svg"
          test -f "$icons/com.episode6.Collins-panel.svg"

  # Every committed copy of the version must agree (see RELEASE_CHECKLIST.md);
  # scripts/ship-release.py re-checks the same invariants at ship time.
  verify-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/verify_versions.py
