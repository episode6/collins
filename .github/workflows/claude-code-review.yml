name: Claude Code Review

# Automatic review on every PR is disabled — the workflow only runs when it is
# dispatched by hand against a specific PR. To re-enable it, restore the
# `pull_request` trigger below and drop the `pr_number` input plumbing.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string
  # pull_request:
  #   types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Required for Claude to post its review to the PR
      issues: read
      id-token: write
      actions: read # Required for Claude to read this PR's CI results

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Puts actions:read on the token Claude's `gh` calls use, so a review
          # can lean on CI's own ruff/pytest results instead of re-running them.
          # The action's github_ci MCP tools stay out of reach either way: it
          # only installs that server for PR-shaped events, and a hand-dispatched
          # run is not one. Reading CI here means `gh run`, hence the allowances
          # and the prompt line below.
          additional_permissions: |
            actions: read
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # Without --comment the plugin reviews the PR and posts nothing at all.
          # The trailing paragraph overrides the plugin command, which otherwise
          # says "Do not check build signal" and files anything a linter would
          # catch as a false positive -- left alone, it would never look.
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ inputs.pr_number }} --comment

            Override one instruction in that command: do read this PR's CI
            signal. `gh pr view <pr> --json statusCheckRollup` names every
            check with its conclusion and a detailsUrl carrying the run and job
            ids; for a failed one, read it with `gh run view --job <job-id>
            --log-failed`. Treat a genuine ruff or pytest failure as an issue
            worth reporting rather than as a false positive. Do not re-run the
            suite yourself. Passing CI stays unremarkable -- say nothing about
            it.
          # gh pr view is already allowed by the plugin command's own frontmatter;
          # naming it here too keeps this workflow standing on its own.
          claude_args: '--model claude-opus-5 --allowedTools "Bash(gh pr view:*),Bash(gh run view:*)"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

