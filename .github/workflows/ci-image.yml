# New in the ghackett fork of agent-session-manager
# (https://github.com/r4nd3l/agent-session-manager, GPL-3.0).

# The gate every container job waits on: resolve the content-addressed tags of
# .github/docker/ci.Dockerfile, and build + push only what GHCR does not have
# yet. One hash, three tags from the same file: the resolute `full` image (the
# default; most containered jobs), the noble packaging-only image (the noble
# PPA source build) and the Fedora packaging image (the RPM / COPR jobs). A PR
# that edits the Dockerfile therefore builds and uses its own images; one that
# leaves it alone finds every tag (~15s of job overhead) and builds nothing.
# Called from ci.yml and release.yml.
#
# Known limitation: on a pull_request from a *fork*, GITHUB_TOKEN is read-only
# no matter what permissions are requested, so a fork PR that edits the
# Dockerfile fails loudly at the push step. A fork PR that leaves it alone is
# fine (the tags exist; pulling needs only read). Accepted: this repo has no
# fork contributors; revisit with pull_request_target if that ever changes.
name: CI image

on:
  workflow_call:
    outputs:
      image:
        description: The resolute full image (ghcr.io/<org>/collins-ci:<tag>)
        value: ${{ jobs.image.outputs.image }}
      image_noble_pkg:
        description: The noble packaging-only image (<tag>-noble-pkg), for the noble PPA source build
        value: ${{ jobs.image.outputs.image_noble_pkg }}
      image_fedora_pkg:
        description: The Fedora packaging image (<tag>-fedora-pkg), for the RPM and COPR jobs
        value: ${{ jobs.image.outputs.image_fedora_pkg }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
      image_noble_pkg: ${{ steps.tag.outputs.image_noble_pkg }}
      image_fedora_pkg: ${{ steps.tag.outputs.image_fedora_pkg }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        run: |
          h="${{ hashFiles('.github/docker/ci.Dockerfile') }}"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-ci:${h::12}" >> "$GITHUB_OUTPUT"
          echo "image_noble_pkg=ghcr.io/${GITHUB_REPOSITORY,,}-ci:${h::12}-noble-pkg" >> "$GITHUB_OUTPUT"
          echo "image_fedora_pkg=ghcr.io/${GITHUB_REPOSITORY,,}-ci:${h::12}-fedora-pkg" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: exists
        run: |
          check() {
            if docker manifest inspect "$2" > /dev/null 2>&1; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
              echo "\`$2\` already exists; nothing to build" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
              echo "Building \`$2\`" >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          check full "${{ steps.tag.outputs.image }}"
          check noble_pkg "${{ steps.tag.outputs.image_noble_pkg }}"
          check fedora_pkg "${{ steps.tag.outputs.image_fedora_pkg }}"
      - if: steps.exists.outputs.full == 'false' || steps.exists.outputs.noble_pkg == 'false' || steps.exists.outputs.fedora_pkg == 'false'
        uses: docker/setup-buildx-action@v3
      # provenance: false keeps each tag a plain image manifest rather than an
      # OCI index with an attestation alongside; nothing here needs one.
      - if: steps.exists.outputs.full == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/ci.Dockerfile
          target: full
          push: true
          provenance: false
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: steps.exists.outputs.noble_pkg == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/ci.Dockerfile
          target: packaging
          build-args: SERIES=24.04
          push: true
          provenance: false
          tags: ${{ steps.tag.outputs.image_noble_pkg }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: steps.exists.outputs.fedora_pkg == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/ci.Dockerfile
          target: fedora-pkg
          push: true
          provenance: false
          tags: ${{ steps.tag.outputs.image_fedora_pkg }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
