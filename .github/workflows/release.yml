# Modified from the original agent-session-manager
# (https://github.com/r4nd3l/agent-session-manager, GPL-3.0) in the ghackett
# fork. Last modified: 2026-08-19. Full change history: git log for this file.

name: Release

# Push a v* tag (scripts/ship-release.py, from a release branch) → build the
# wheel/sdist + .deb, publish to PyPI (OIDC trusted publishing), attach the
# .deb to the GitHub Release, upload a source package per Ubuntu series
# to ppa:episode6/stable, and push the updated recipe to the AUR.
# See RELEASE_CHECKLIST.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel + sdist
        run: |
          pip install --quiet build
          python -m build
      - name: Build .deb
        run: ./scripts/build_deb.sh
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.deb

  github-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # scripts/ship-release.py creates the release (with notes extracted
      # from docs/releases.md) before the tag ever reaches CI, so the normal
      # path is attaching to it. A bare tag pushed without a release still
      # works, as a fallback.
      - name: Attach the .deb to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.deb \
              --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.deb \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi

  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # The OIDC token carries an `environment` claim only when the job names an
    # environment, and PyPI's trusted publisher matches it exactly: this name
    # and the publisher's "GitHub Actions environment name" field must be
    # identical, or both empty. A mismatch is rejected at upload time -- on the
    # release tag, after the .deb is attached and the PPA upload has gone out.
    # Change one side without the other and you ship half a release.
    #
    # The environment itself must also allow the ref: its deployment policy
    # needs a *tag* pattern of v*, configured separately from branch patterns.
    # Left on the default policy it matches no tag at all and this job waits
    # forever, looking like a permissions failure.
    # See ~/specs/collins/github-environments.md.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Keep only PyPI artifacts
        run: rm -f dist/*.deb
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Source-only uploads to ppa:episode6/stable; Launchpad does the binary
  # builds. Does not consume the build job's artifacts -- it exports git HEAD
  # itself -- but gates on it so a broken wheel stops the release everywhere.
  #
  # A version string is burned in the archive forever, so this job is written
  # to refuse rather than guess: it checks the changelog against the tag, and
  # skips a series whose version Launchpad already has.
  ppa:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      # The packaging subkey. Pinned so gpg cannot walk to a different
      # signing-capable key; see ~/specs/collins/signing-key-and-ppa.md 1.4.
      KEYID: 3EBBA2410EE1077E
      PPA: ppa:episode6/stable
    strategy:
      # One series must not cancel the other's upload.
      fail-fast: false
      matrix:
        series: [noble, resolute]
    steps:
      - uses: actions/checkout@v7

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            devscripts dput debhelper dh-python pybuild-plugin-pyproject \
            python3-all

      - name: Check the tag against debian/changelog
        run: |
          base="$(dpkg-parsechangelog --file debian/changelog --show-field Version)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$base" != "$tag" ]; then
            echo "::error::debian/changelog is at $base but the tag is $tag."
            echo "The PPA version derives from the changelog, not the tag, so"
            echo "this would publish the wrong version -- permanently. Add the"
            echo "changelog entry and re-tag."
            exit 1
          fi

      - name: Skip if the archive already has this version
        id: dupe
        run: |
          ver="${GITHUB_REF_NAME#v}~${{ matrix.series }}1"
          n="$(curl -sfG \
                'https://api.launchpad.net/1.0/~episode6/+archive/ubuntu/stable' \
                --data-urlencode 'ws.op=getPublishedSources' \
                --data-urlencode 'source_name=collins' \
                --data-urlencode 'exact_match=true' \
                --data-urlencode "version=$ver" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["total_size"])')"
          if [ "$n" = "0" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$ver is already in $PPA -- nothing to upload."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Import the packaging key
        if: steps.dupe.outputs.skip == 'false'
        env:
          PPA_GPG_KEY: ${{ secrets.PPA_GPG_KEY }}
          GPG_PASS: ${{ secrets.GPG_PASS }}
        run: |
          if [ -z "$PPA_GPG_KEY" ] || [ -z "$GPG_PASS" ]; then
            echo "::error::PPA_GPG_KEY / GPG_PASS are not set. The first"
            echo "holds gpg --export-secret-subkeys --armor '$KEYID!' -- the"
            echo "bang matters, it stubs the primary out to gnu-dummy."
            exit 1
          fi
          umask 077
          mkdir -p ~/.gnupg
          printf '%s' "$PPA_GPG_KEY" | gpg --batch --import
          # Exits non-zero when the blob did not actually carry the subkey,
          # which otherwise surfaces much later as an opaque signing failure.
          gpg --list-secret-keys "$KEYID" > /dev/null
          printf '%s' "$GPG_PASS" > "$RUNNER_TEMP/passphrase"
          # debsign takes the gpg program by name and debuild normalizes PATH,
          # so a wrapper on a prepended path is how the passphrase reaches gpg
          # without a tty. Nothing here depends on gpg-agent caching.
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/gpg-loopback" <<EOF
          #!/bin/sh
          exec gpg --batch --pinentry-mode loopback \\
              --passphrase-file "$RUNNER_TEMP/passphrase" "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/bin/gpg-loopback"

      - name: Build the signed source package
        if: steps.dupe.outputs.skip == 'false'
        run: |
          packaging/build-ppa-source.sh --series '${{ matrix.series }}' -k "$KEYID" \
            -- --prepend-path="$RUNNER_TEMP/bin" -pgpg-loopback

      - name: Upload to the PPA
        if: steps.dupe.outputs.skip == 'false'
        run: |
          dput "$PPA" \
            "/tmp/collins-ppa/${{ matrix.series }}"/collins_*_source.changes

  # Publishes the build recipe to the AUR package repo
  # (ssh://aur@aur.archlinux.org/collins.git). The AUR hosts no binaries --
  # publishing is a git push of PKGBUILD + .SRCINFO, and each user's machine
  # fetches the tag tarball from GitHub and builds locally -- so this job's
  # entire output is that push. scripts/ship-release.py creates the GitHub
  # release (and with it the tag tarball) before the tag ever reaches CI, so
  # the tarball this job hashes already exists.
  #
  # sha256sums stays SKIP in git, since the hash cannot exist before the tag
  # does; this job fills it in, regenerates .SRCINFO with makepkg, and
  # test-builds the package -- a typo'd dependency name or broken recipe
  # stops here instead of on some Arch user's machine. Re-running a tag's
  # workflow is harmless: an AUR repo already at this content skips the push.
  aur:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install packaging tools
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Su --noconfirm --needed base-devel git openssh

      - uses: actions/checkout@v7

      - name: Check the tag against PKGBUILD pkgver
        run: |
          pkgver="$(sed -n 's/^pkgver=//p' packaging/aur/PKGBUILD)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkgver" != "$tag" ]; then
            echo "::error::packaging/aur/PKGBUILD is at pkgver=$pkgver but the"
            echo "tag is $tag. The version-bump PRs set pkgver when the release"
            echo "branch is cut (RELEASE_CHECKLIST.md); fix the PKGBUILD and"
            echo "re-tag."
            exit 1
          fi

      - name: Check the AUR key is configured
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::error::AUR_SSH_PRIVATE_KEY is not set. It holds an OpenSSH"
            echo "private key whose public half is registered on the episode6"
            echo "AUR account (see packaging/aur/README.md)."
            exit 1
          fi

      - name: Fill in the source tarball hash
        run: |
          cd packaging/aur
          # Saved under the exact name the PKGBUILD's source array expects, so
          # the test build below reuses this download and re-verifies its hash.
          tarball="collins-${GITHUB_REF_NAME#v}.tar.gz"
          curl -sfL --retry 5 --retry-delay 10 -o "$tarball" \
            "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          hash="$(sha256sum "$tarball" | cut -d' ' -f1)"
          sed -i "s/^sha256sums=.*/sha256sums=('$hash')/" PKGBUILD

      - name: Regenerate .SRCINFO and test-build the package
        run: |
          useradd -m builder
          chown -R builder packaging/aur
          cd packaging/aur
          # makepkg refuses to run as root, hence the builder user.
          runuser -u builder -- makepkg --printsrcinfo > "$RUNNER_TEMP/srcinfo.new"
          # The committed .SRCINFO is a tracked mirror; the generated copy is
          # ground truth for what gets pushed. Drift is a repo-hygiene problem,
          # not a release problem -- warn, don't block the release. (Ignores
          # comment lines, blank lines, and the sha256sums value, which is
          # SKIP in git by design.)
          norm() {
            grep -v '^#' "$1" | sed -e '/^[[:space:]]*$/d' \
              -e 's/^\([[:space:]]*sha256sums = \).*/\1@/'
          }
          if ! diff -u <(norm .SRCINFO) <(norm "$RUNNER_TEMP/srcinfo.new"); then
            echo "::warning::packaging/aur/.SRCINFO is out of date with what"
            echo "makepkg generates from PKGBUILD. Publishing the generated"
            echo "copy; regenerate the committed one to match."
          fi
          { grep '^#' .SRCINFO; echo; cat "$RUNNER_TEMP/srcinfo.new"; } \
            > "$RUNNER_TEMP/srcinfo.aur"
          # Test build before publishing anything: pacman resolving every
          # declared dependency catches a typo'd name, and makepkg re-verifies
          # the tarball hash and exercises the whole recipe.
          (source PKGBUILD && \
            pacman -S --noconfirm --needed "${depends[@]}" "${makedepends[@]}")
          runuser -u builder -- makepkg --noconfirm

      - name: Push to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/aur-key"
          # The AUR's ed25519 host key, pinned like the ppa job pins its gpg
          # key (verified 2026-08-18 via ssh-keyscan aur.archlinux.org);
          # refresh this line if the AUR ever rotates it.
          printf '%s\n' 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' \
            > "$RUNNER_TEMP/aur-hosts"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/aur-key -o UserKnownHostsFile=$RUNNER_TEMP/aur-hosts -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes"
          # Cloning the (possibly still empty) AUR repo: the first push
          # creates the package.
          git clone ssh://aur@aur.archlinux.org/collins.git "$RUNNER_TEMP/aur-repo"
          cp packaging/aur/PKGBUILD "$RUNNER_TEMP/aur-repo/PKGBUILD"
          cp "$RUNNER_TEMP/srcinfo.aur" "$RUNNER_TEMP/aur-repo/.SRCINFO"
          cd "$RUNNER_TEMP/aur-repo"
          if [ -z "$(git status --porcelain)" ]; then
            echo "::notice::The AUR already matches ${GITHUB_REF_NAME} -- nothing to push."
            exit 0
          fi
          git add PKGBUILD .SRCINFO
          git -c user.name='episode6' -c user.email='support@episode6.com' \
            commit -m "Update to ${GITHUB_REF_NAME}"
          # The AUR accepts exactly one branch, master.
          git push origin HEAD:master
