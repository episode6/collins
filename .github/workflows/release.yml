# Modified from the original agent-session-manager
# (https://github.com/r4nd3l/agent-session-manager, GPL-3.0) in the ghackett
# fork. Last modified: 2026-08-23. Full change history: git log for this file.

name: Release

# Push a v* tag (scripts/ship-release.py, from a release branch) → build the
# wheel/sdist + .deb, publish to PyPI (OIDC trusted publishing), attach the
# .deb to the GitHub Release, and upload a source package per Ubuntu series
# to ppa:episode6/stable. See RELEASE_CHECKLIST.md.
on:
  push:
    tags: ['v*']
  # Manual runs re-drive the ppa job for a tag that already exists -- a
  # tag's own run is frozen on the workflow as it was at the tag, so a fix to
  # this file can only reach an already-shipped release this way. Dispatch it
  # from the branch that carries the fix; the job checks out the tag itself.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to (re)upload to the PPA
        required: false
        type: string

# build and ppa run inside the prebuilt CI images (.github/docker/ci.Dockerfile,
# resolved or built by the image job) -- the same images ci.yml's packaging and
# ppa-source jobs use, so a release builds in exactly the environment every PR
# rehearsed. github-release and pypi stay on the bare runner: they need only gh
# and the PyPI action, and the pypi job's OIDC environment wiring must not
# move. A manual dispatch takes its images from the dispatching branch's
# Dockerfile, not the tag's -- the same way it takes this file.
jobs:
  image:
    uses: ./.github/workflows/ci-image.yml
    permissions:
      contents: read
      packages: write

  build:
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      # --no-isolation: the image's setuptools builds the wheel -- the one
      # ci.yml's packaging job checked with verify_wheel_data.py and the one the
      # resolute PPA build uses -- rather than whatever PyPI has that day.
      - name: Build wheel + sdist
        run: python3 -m build --no-isolation
      - name: Build .deb
        run: ./scripts/build_deb.sh
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.deb

  github-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # scripts/ship-release.py creates the release (with notes extracted
      # from docs/releases.md) before the tag ever reaches CI, so the normal
      # path is attaching to it. A bare tag pushed without a release still
      # works, as a fallback.
      - name: Attach the .deb to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.deb \
              --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.deb \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi

  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # The OIDC token carries an `environment` claim only when the job names an
    # environment, and PyPI's trusted publisher matches it exactly: this name
    # and the publisher's "GitHub Actions environment name" field must be
    # identical, or both empty. A mismatch is rejected at upload time -- on the
    # release tag, after the .deb is attached and the PPA upload has gone out.
    # Change one side without the other and you ship half a release.
    #
    # The environment itself must also allow the ref: its deployment policy
    # needs a *tag* pattern of v*, configured separately from branch patterns.
    # Left on the default policy it matches no tag at all and this job waits
    # forever, looking like a permissions failure.
    # See ~/specs/collins/github-environments.md.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Keep only PyPI artifacts
        run: rm -f dist/*.deb
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Source-only uploads to ppa:episode6/stable; Launchpad does the binary
  # builds. Does not consume the build job's artifacts -- it exports git HEAD
  # itself -- but gates on it so a broken wheel stops the release everywhere.
  #
  # A version string is burned in the archive forever, so this job is written
  # to refuse rather than guess: it checks the changelog against the tag, and
  # skips a series whose version Launchpad already has.
  ppa:
    needs: [image, build]
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    # A source build compiles nothing, so the noble leg runs in the noble
    # packaging-only image; resolute uses the full image, as ci.yml's
    # ppa-source does. Everything below (gnupg, dput, curl, the debhelper
    # toolchain) is in the packaging stage of both.
    container:
      image: ${{ matrix.series == 'noble' && needs.image.outputs.image_noble_pkg || needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      # The tag being uploaded: the pushed one, or the one a manual run names.
      TAG: ${{ inputs.tag || github.ref_name }}
      # The packaging subkey. Pinned so gpg cannot walk to a different
      # signing-capable key; see ~/specs/collins/signing-key-and-ppa.md 1.4.
      KEYID: 3EBBA2410EE1077E
      PPA: ppa:episode6/stable
    strategy:
      # One series must not cancel the other's upload.
      fail-fast: false
      matrix:
        series: [noble, resolute]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Check the tag against debian/changelog
        run: |
          base="$(dpkg-parsechangelog --file debian/changelog --show-field Version)"
          tag="${TAG#v}"
          if [ "$base" != "$tag" ]; then
            echo "::error::debian/changelog is at $base but the tag is $tag."
            echo "The PPA version derives from the changelog, not the tag, so"
            echo "this would publish the wrong version -- permanently. Add the"
            echo "changelog entry and re-tag."
            exit 1
          fi

      - name: Skip if the archive already has this version
        id: dupe
        run: |
          ver="${TAG#v}~${{ matrix.series }}1"
          n="$(curl -sfG \
                'https://api.launchpad.net/1.0/~episode6/+archive/ubuntu/stable' \
                --data-urlencode 'ws.op=getPublishedSources' \
                --data-urlencode 'source_name=collins' \
                --data-urlencode 'exact_match=true' \
                --data-urlencode "version=$ver" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["total_size"])')"
          if [ "$n" = "0" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$ver is already in $PPA -- nothing to upload."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Import the packaging key
        if: steps.dupe.outputs.skip == 'false'
        env:
          PPA_GPG_KEY: ${{ secrets.PPA_GPG_KEY }}
          GPG_PASS: ${{ secrets.GPG_PASS }}
        run: |
          if [ -z "$PPA_GPG_KEY" ] || [ -z "$GPG_PASS" ]; then
            echo "::error::PPA_GPG_KEY / GPG_PASS are not set. The first"
            echo "holds gpg --export-secret-subkeys --armor '$KEYID!' -- the"
            echo "bang matters, it stubs the primary out to gnu-dummy."
            exit 1
          fi
          umask 077
          mkdir -p ~/.gnupg
          printf '%s' "$PPA_GPG_KEY" | gpg --batch --import
          # Exits non-zero when the blob did not actually carry the subkey,
          # which otherwise surfaces much later as an opaque signing failure.
          gpg --list-secret-keys "$KEYID" > /dev/null
          printf '%s' "$GPG_PASS" > "$RUNNER_TEMP/passphrase"
          # debsign takes the gpg program by name and debuild normalizes PATH,
          # so a wrapper on a prepended path is how the passphrase reaches gpg
          # without a tty. Nothing here depends on gpg-agent caching.
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/gpg-loopback" <<EOF
          #!/bin/sh
          exec gpg --batch --pinentry-mode loopback \\
              --passphrase-file "$RUNNER_TEMP/passphrase" "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/bin/gpg-loopback"

      - name: Build the signed source package
        if: steps.dupe.outputs.skip == 'false'
        run: |
          packaging/build-ppa-source.sh --series '${{ matrix.series }}' -k "$KEYID" \
            -- --prepend-path="$RUNNER_TEMP/bin" -pgpg-loopback

      - name: Upload to the PPA
        if: steps.dupe.outputs.skip == 'false'
        run: |
          dput "$PPA" \
            "/tmp/collins-ppa/${{ matrix.series }}"/collins_*_source.changes
