# THROWAWAY. PR 0 of the macOS/Homebrew port (~/specs/collins/macos-homebrew-port.md):
# a verification spike on GitHub's Apple Silicon runners. Every step is
# continue-on-error on purpose -- a red step is an answer, not a broken
# build -- and the summary step collects the RESULT/PASS/FAIL lines from
# scripts/spike/. To be deleted, or turned into the real macOS CI job, in PR 4.

name: macOS spike

on:
  workflow_dispatch:
  push:
    branches: [macos-spike-pr0]

jobs:
  spike:
    # Apple Silicon only (the port never promises Intel); macos-15 is arm64.
    runs-on: macos-15
    timeout-minutes: 60
    env:
      OUT: ${{ github.workspace }}/spike-out
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Runner facts
        run: |
          mkdir -p "$OUT"
          uname -a
          sw_vers
          echo "arch: $(uname -m)"
          echo "brew prefix: $(brew --prefix)"
          echo "SHELL=$SHELL TMPDIR=$TMPDIR HOME=$HOME"
          launchctl managername || true
          id

      # The spec's formula table, verbatim. hunk is in homebrew-core.
      - name: brew install the stack
        id: brew
        continue-on-error: true
        run: |
          set -x
          brew install python@3.14 pygobject3 gtk4 libadwaita vte3 gtksourceview5 \
            libspelling gstreamer adwaita-icon-theme hicolor-icon-theme dbus hunk \
            2>&1 | tee "$OUT/brew-install.log"
          brew list --versions python@3.14 pygobject3 gtk4 libadwaita vte3 gtksourceview5 \
            libspelling gstreamer adwaita-icon-theme hicolor-icon-theme dbus hunk glib \
            | tee "$OUT/brew-versions.txt"

      # pygobject3's bottle links `gi` into whichever python@X.Y versions the
      # formula depends on today; the first run showed python@3.14 without it.
      # Find the site-packages that actually carries gi and use that python,
      # recording what the formula depends on so the spec can pin the right one.
      - name: Find the python that has gi, export XDG_DATA_DIRS
        run: |
          PREFIX="$(brew --prefix)"
          {
            echo "brew deps --installed pygobject3: $(brew deps --installed pygobject3 | tr '\n' ' ')"
            echo "gi dirs:"; ls -d "$PREFIX"/lib/python3.*/site-packages/gi 2>/dev/null || echo "  (none under $PREFIX/lib)"
            echo "pygobject3 cellar pythons:"; ls -d "$(brew --prefix pygobject3)"/lib/python3.* 2>/dev/null || true
            echo "installed pythons: $(ls -d "$PREFIX"/opt/python@3.* | tr '\n' ' ')"
            for py in "$PREFIX"/opt/python@3.*/bin/python3.[0-9]*; do
              case "$py" in *config*) continue;; esac
              echo "$py -> $("$py" -c 'import gi; print("gi ok", gi.__file__)' 2>&1 | tail -1)"
            done
          } | tee "$OUT/python-facts.txt"
          PY=""
          for cand in 3.14 3.13 3.15; do
            if [ -d "$PREFIX/lib/python$cand/site-packages/gi" ] && [ -x "$PREFIX/opt/python@$cand/bin/python$cand" ]; then
              PY="$PREFIX/opt/python@$cand/bin/python$cand"; break
            fi
          done
          if [ -z "$PY" ]; then
            echo "FAIL gi_python no brew python has gi; falling back to python@3.14" | tee -a "$OUT/python-facts.txt"
            PY="$(brew --prefix python@3.14)/bin/python3.14"
          else
            echo "PASS gi_python $PY" | tee -a "$OUT/python-facts.txt"
          fi
          cp "$OUT/python-facts.txt" "$OUT/python-facts.log"
          echo "PY=$PY" >> "$GITHUB_ENV"
          echo "XDG_DATA_DIRS=$PREFIX/share:/usr/local/share:/usr/share" >> "$GITHUB_ENV"
          echo "PYTHONPATH=${{ github.workspace }}" >> "$GITHUB_ENV"
          echo "PYTHONUNBUFFERED=1" >> "$GITHUB_ENV"
          "$PY" --version
          hunk --version || true

      - name: Assert Vte-3.91.typelib is in the bottle
        continue-on-error: true
        run: |
          DIR="$(brew --prefix)/lib/girepository-1.0"
          ls "$DIR" | tee "$OUT/typelibs.txt"
          if [ -f "$DIR/Vte-3.91.typelib" ]; then
            echo "PASS vte_typelib $DIR/Vte-3.91.typelib" | tee -a "$OUT/typelib.log"
          else
            echo "FAIL vte_typelib missing under $DIR" | tee -a "$OUT/typelib.log"; exit 1
          fi

      - name: gi import smoke test (item 2)
        continue-on-error: true
        run: |
          "$PY" scripts/spike/gi_smoke.py 2>&1 | tee "$OUT/gi_smoke.log"; exit "${PIPESTATUS[0]}"

      # Bus questions run before the service is up, then again after, so the
      # same script answers both halves of resolved question 5.
      - name: Session bus, without dbus (item b, nobus)
        continue-on-error: true
        run: |
          "$PY" scripts/spike/check_bus.py nobus 2>&1 | tee "$OUT/bus-nobus.log"; exit "${PIPESTATUS[0]}"

      # The dbus formula ships no launchd service any more ("Formula `dbus` has
      # not implemented #plist, #service", first run), so `brew services start
      # dbus` is not a thing. Start a session daemon by hand and publish its
      # socket the way the old plist did -- `launchctl setenv
      # DBUS_LAUNCHD_SESSION_BUS_SOCKET` -- which is exactly what GLib's macOS
      # bus lookup reads. DBUS_SESSION_BUS_ADDRESS stays unset here so the
      # launchd route is what gets tested; the "env" run below tests the other.
      - name: Start a session dbus-daemon and publish it via launchctl
        continue-on-error: true
        run: |
          {
            echo "brew services start dbus:"; brew services start dbus 2>&1 || true
            echo "plists under dbus prefix: $(find "$(brew --prefix dbus)"/ -name '*.plist' 2>/dev/null | tr '\n' ' ')"
            SOCK="$TMPDIR/collins-spike-dbus.sock"
            "$(brew --prefix dbus)/bin/dbus-daemon" --session --fork --nopidfile --address="unix:path=$SOCK" --print-address
            sleep 1
            ls -la "$SOCK"
            launchctl setenv DBUS_LAUNCHD_SESSION_BUS_SOCKET "$SOCK"
            echo "launchctl getenv: $(launchctl getenv DBUS_LAUNCHD_SESSION_BUS_SOCKET)"
            echo "DBUS_SPIKE_ADDRESS=unix:path=$SOCK" >> "$GITHUB_ENV"
          } 2>&1 | tee "$OUT/dbus-start.log"

      - name: Session bus via launchctl (item b, bus)
        continue-on-error: true
        run: |
          "$PY" scripts/spike/check_bus.py bus 2>&1 | tee "$OUT/bus-bus.log"; exit "${PIPESTATUS[0]}"

      - name: Session bus via DBUS_SESSION_BUS_ADDRESS (item b, env)
        continue-on-error: true
        run: |
          DBUS_SESSION_BUS_ADDRESS="$DBUS_SPIKE_ADDRESS" "$PY" scripts/spike/check_bus.py env 2>&1 | tee "$OUT/bus-env.log"; exit "${PIPESTATUS[0]}"

      - name: VTE window, default renderer (item a)
        continue-on-error: true
        run: |
          "$PY" scripts/spike/check_vte_window.py "$OUT" default 2>&1 | tee "$OUT/vte-default.log"; exit "${PIPESTATUS[0]}"

      - name: VTE window, GSK_RENDERER=cairo (item a)
        continue-on-error: true
        env:
          GSK_RENDERER: cairo
        run: |
          "$PY" scripts/spike/check_vte_window.py "$OUT" cairo 2>&1 | tee "$OUT/vte-cairo.log"; exit "${PIPESTATUS[0]}"

      - name: kqueue file monitors (item c)
        continue-on-error: true
        run: |
          "$PY" scripts/spike/check_kqueue.py 2>&1 | tee "$OUT/kqueue.log"; exit "${PIPESTATUS[0]}"

      - name: Gio.AppInfo under gosxappinfo (item d)
        continue-on-error: true
        run: |
          "$PY" scripts/spike/check_appinfo.py 2>&1 | tee "$OUT/appinfo.log"; exit "${PIPESTATUS[0]}"

      - name: Peer pid and trash (item e)
        continue-on-error: true
        run: |
          "$PY" scripts/spike/check_creds_trash.py 2>&1 | tee "$OUT/creds-trash.log"; exit "${PIPESTATUS[0]}"

      # GTK-free by design; tests/test_proctree.py skips itself without /proc.
      # Whatever else fails here is the input for PR 1, not a blocker.
      - name: Unit suite under brew python (item f)
        continue-on-error: true
        run: |
          "$PY" -m venv --system-site-packages "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pytest
          "$RUNNER_TEMP/venv/bin/python" -c "import gi; print('gi from', gi.__file__)"
          "$RUNNER_TEMP/venv/bin/python" -m pytest tests/ -q -rfEs -p no:cacheprovider 2>&1 | tee "$OUT/pytest.log"
          rc="${PIPESTATUS[0]}"
          tail -1 "$OUT/pytest.log" | sed 's/^/RESULT pytest /' | tee -a "$OUT/pytest-result.log"
          if [ "$rc" = 0 ]; then echo "PASS pytest" | tee -a "$OUT/pytest-result.log"; else echo "FAIL pytest rc=$rc" | tee -a "$OUT/pytest-result.log"; fi
          exit "$rc"

      - name: Launch Collins (item 5, proctree as is)
        continue-on-error: true
        run: |
          "$PY" scripts/spike/launch_collins.py "$OUT" plain 2>&1 | tee "$OUT/launch-plain.log"; exit "${PIPESTATUS[0]}"

      - name: Launch Collins (item 5, proctree stubbed)
        continue-on-error: true
        env:
          SPIKE_STUB_PROCTREE: "1"
        run: |
          "$PY" scripts/spike/launch_collins.py "$OUT" stubbed 2>&1 | tee "$OUT/launch-stubbed.log"; exit "${PIPESTATUS[0]}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## macOS spike results"
            echo
            echo '```'
            grep -h -E '^(PASS|FAIL|RESULT) ' "$OUT"/*.log 2>/dev/null || echo "(no result lines)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: macos-spike-results
          path: spike-out/
          if-no-files-found: warn
