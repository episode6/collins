# New in the ghackett fork of agent-session-manager
# (https://github.com/r4nd3l/agent-session-manager, GPL-3.0).

name: E2E

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Experimental: results are informative only and never fail the workflow
    # run. Remove continue-on-error once the suite has proven stable in CI.
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Unlike the unit-test job (which deliberately stays GTK-free to match
      # tests/conftest.py's blocklist), the e2e checks drive real widgets:
      # they need the full gir stack, a display (Xvfb), and a session bus
      # (dbus-run-session, one per check, provided by the runner).
      - run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1
          gir1.2-gtksource-5 gir1.2-spelling-1 gir1.2-gdkpixbuf-2.0
          xvfb xauth dbus fonts-dejavu-core git
      # The GTK4 VTE gir was renamed between Ubuntu releases: noble ships it
      # as gir1.2-vte-3.91, newer releases as gir1.2-vte-3.91-gtk4.
      - run: >
          sudo apt-get install -y --no-install-recommends gir1.2-vte-3.91-gtk4
          || sudo apt-get install -y --no-install-recommends gir1.2-vte-3.91
      # Per-check cap well under timeout-minutes even at 8 timeouts, so a
      # pathological run still writes its step-summary table instead of
      # being hard-killed by GitHub mid-suite. The whole suite passes in
      # under two minutes; a check that needs more than 120s is hung.
      - run: xvfb-run -a -s "-screen 0 1920x1200x24" python3 scripts/run_e2e.py --timeout 120
        env:
          # No a11y bus exists under Xvfb; stop GTK warning about it.
          GTK_A11Y: none
